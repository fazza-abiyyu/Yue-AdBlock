name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test --coverage

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  integration:
    name: Newman Integration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start server
        run: bun run start &
      - name: Wait for server
        run: |
          echo "Waiting for server to be ready..."
          for i in $(seq 1 60); do
            if curl -s http://localhost:3000/health/live | grep -q '"status"'; then
              echo "Server is ready!"
              exit 0
            fi
            echo "Attempt $i/60 - waiting 1s..."
            sleep 1
          done
          echo "Server failed to start within 60 seconds"
          exit 1
      - name: Run Newman tests
        run: bun run test:postman
      - name: Kill server
        if: always()
        run: pkill -f "bun run src/index.ts" || true
