name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run lint

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun test --coverage

  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run test:e2e

  integration:
    name: Newman Integration
    needs: [lint, test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: Start server and run tests
        run: |
          nohup bun run src/index.ts > server.log 2>&1 &
          echo "PID=$!"
          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/health/live > /dev/null 2>&1; then
              echo "Server ready on attempt $i"
              break
            fi
            sleep 2
          done
          cat server.log
          bun run test:postman
          EXIT=$?
          pkill -f "bun run src/index.ts" || true
          exit $EXIT
